name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with 90% coverage gate
        run: ../scripts/coverage/check.sh backend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with 90% coverage gate
        run: npm run test:coverage

      - name: Type-check and build
        run: npm run build

      - name: Report bundle size
        run: |
          {
            echo '### Frontend bundle size'
            echo
            echo '| File | Size | Gzip |'
            echo '| --- | ---: | ---: |'
            find dist -type f | sort | while read -r file; do
              echo "| ${file#dist/} | $(wc -c < "$file") B | $(gzip -c "$file" | wc -c) B |"
            done
            echo
            echo "Total: $(find dist -type f -exec cat {} + | wc -c) B"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check NuGet packages
        run: scripts/audit/nuget.sh

      - name: Check frontend npm packages
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check e2e npm packages
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npm audit --audit-level=high

  docker:
    name: docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA...HEAD")
          echo "$files"
          shared='^\.github/workflows/ci\.yml$'
          frontend='^frontend/(Dockerfile|\.dockerignore|nginx\.conf|security-headers\.conf|package\.json|package-lock\.json)$'
          backend='^backend/(Dockerfile|\.dockerignore|Directory\.Build\.props|Directory\.Packages\.props|GymRatService\.sln|.*\.csproj)$'
          if echo "$files" | grep -Eq "$shared|$frontend"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -Eq "$shared|$backend"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend image
        if: steps.changes.outputs.frontend == 'true'
        run: docker build --tag gymrat-frontend:ci frontend

      - name: Build backend image
        if: steps.changes.outputs.backend == 'true'
        run: docker build --tag gymrat-backend:ci backend

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gymrat
          POSTGRES_USER: gymrat
          POSTGRES_PASSWORD: gymrat-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymrat -d gymrat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GYMRAT_TEST_POSTGRES: Host=localhost;Port=5432;Database=gymrat;Username=gymrat;Password=gymrat-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect database and backend changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...HEAD")
          echo "$files"
          if echo "$files" | grep -Eq '^(backend/|database/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Liquibase changelog to an empty database
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/database/changelog:/liquibase/changelog:ro" \
            liquibase/liquibase:4.32 \
            --changelog-file=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/gymrat \
            --username=gymrat \
            --password=gymrat-ci \
            update

      - uses: actions/setup-dotnet@v5
        if: steps.changes.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Run Postgres smoke and schema parity tests
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: dotnet test tests/GymRatService.IntegrationTests --filter "Category=Postgres" --logger "console;verbosity=normal"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...HEAD")
          echo "$files"
          if echo "$files" | grep -Eq '^(frontend/|backend/|database/|infra/|e2e/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the stack
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: |
          {
            echo "ASPNETCORE_ENVIRONMENT=Development"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_KEY=$(openssl rand -hex 32)"
            echo "PASSWORD_PEPPER=$(openssl rand -hex 32)"
          } > .env
          docker compose up --build --detach

      - name: Wait for the app
        if: steps.changes.outputs.run == 'true'
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/sessions/active || true)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --file infra/docker-compose.yml logs
          exit 1

      - name: Install
        if: steps.changes.outputs.run == 'true'
        working-directory: e2e
        run: npm ci

      - name: Install browser
        if: steps.changes.outputs.run == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Type-check
        if: steps.changes.outputs.run == 'true'
        working-directory: e2e
        run: npm run typecheck

      - name: Core flow smoke test
        if: steps.changes.outputs.run == 'true'
        working-directory: e2e
        run: npm test

      - name: Upload failure screenshots
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: e2e-test-results
          path: e2e/test-results

      - name: Show stack logs on failure
        if: failure() && steps.changes.outputs.run == 'true'
        run: docker compose --file infra/docker-compose.yml logs

      - name: Stop the stack
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose --file infra/docker-compose.yml down --volumes
