services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gymrat
      POSTGRES_USER: gymrat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymrat-dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymrat -d gymrat"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: liquibase/liquibase:4.32
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../database/changelog:/liquibase/changelog:ro
    command:
      - --changelog-file=changelog/db.changelog-master.xml
      - --url=jdbc:postgresql://postgres:5432/gymrat
      - --username=gymrat
      - --password=${POSTGRES_PASSWORD:-gymrat-dev}
      - update

  backend:
    build: ../backend
    depends_on:
      db:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=gymrat;Username=gymrat;Password=${POSTGRES_PASSWORD:-gymrat-dev}
      JwtSettings__Key: ${JWT_KEY:-gymrat-development-only-jwt-signing-key}
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
